# Blueprint Render : API Fastify + base PostgreSQL.
# Déploie via https://render.com → New → Blueprint → pointe sur ce repo.
services:
  - type: web
    name: laundry-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: laundry-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: API_PORT
        value: "4000"
      - key: PLATFORM_COMMISSION_RATE
        value: "0.15"
      - key: SPONSORSHIP_REQUIRED
        value: "5"
      # À renseigner à la main dans le dashboard (secrets) :
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: laundry-db
    plan: starter
